# openbnet's settings. Everything here is the default; change what you need.
# Explained in docs/CONFIGURATION.md. Hosting for others, domains and Cloudflare: docs/DEPLOYMENT.md.
# Paths are relative to this file's folder. To apply changes, send the server SIGHUP. Listening addresses, [database],
# [files], max_connections and existing channels need a restart.

[server]
name = "openbnet"
listen = "0.0.0.0:6112"
max_connections = 2000
max_connections_per_ip = 16     # 0 means no limit
login_timeout_secs = 120
ping_interval_secs = 120
shutdown_secs = 5               # warning before the server stops
products = ["W2BN"]             # games allowed in; empty allows every supported game
strict_versions = false         # true refuses unknown or modified game versions

[database]
url = ""                        # empty keeps it in openbnet.db here; or postgres://user:password@host/database

[files]
directory = "files"             # optional: version-check MPQs, icons, texts; see docs/CONFIGURATION.md
allow_unknown = false           # true serves MPQs with unknown checksums, which games will run

[network]
# public_ip = "203.0.113.9"     # for a server or hosts behind NAT
local = []                      # e.g. ["192.168.1.0/24"]
# [[network.override]]
# host = "192.168.1.50"
# public = "203.0.113.9:6118"

[accounts]
allow_new = true
symbols = "-_[]"
max_failures = 10               # wrong passwords per address; 0 means no limit
window_secs = 300               # over this time
max_signups = 5                 # new accounts per address; 0 means no limit
signup_window_secs = 3600       # over this time

[chat]
welcome = []
flood_lines = 5
flood_secs = 5
flood_disconnect_lines = 10
max_line = 200

[games]
hide_private = true
hide_started = true
disconnect_is_loss = false

[bots]                          # bot and telnet chat on the game port; sends passwords unencrypted
enabled = false
accounts = []                   # accounts that may use it; ["*"] means all

[irc]
# listen = "0.0.0.0:6667"       # sends passwords unencrypted
# tls_listen = "0.0.0.0:6697"
# certificate = "cert.pem"
# key = "key.pem"

[http]                          # HTTP and WebSocket API; put a proxy with TLS in front
listen = "127.0.0.1:6180"
max_connections = 256
behind_proxy = false            # true believes X-Forwarded-For
admin_token = ""                # password of the administration API; empty turns it off

[[build]]                       # War2Combat 4.6.1, accepted by strict_versions besides PvPGN's list
product = "W2BN"
version = "2.0.2.0"
checksum = 0x270dfc2b
tag = "W2BN_202A"

# [[ad]]                        # a banner; pcx, smk, mng or png, in the files directory
# file = "banner.pcx"
# url = "https://example.com"
# product = "W2BN"              # leave out for every game

[[channel]]
name = "The Void"

[[channel]]
name = "War2BNE-1"
alias = "War2BNE"
products = ["W2BN"]

[[channel]]
name = "Starcraft-1"
alias = "Starcraft"
products = ["STAR"]

[[channel]]
name = "Brood War-1"
alias = "Brood War"
products = ["SEXP"]

[[channel]]
name = "Diablo Retail-1"
alias = "Diablo Retail"
products = ["DRTL"]

[[channel]]
name = "Diablo II-1"
alias = "Diablo II"
products = ["D2DV", "D2XP"]

[[channel]]
name = "Chat"
products = ["CHAT"]

[[channel]]
name = "Backstage"
staff_only = true

[[channel]]
name = "Moderated Support"
alias = "Support"
moderated = true
